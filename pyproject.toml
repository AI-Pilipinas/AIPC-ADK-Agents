[project]
name = "aipc-adk-agents"
version = "0.1.0"
description = "AI Pilipinas Cebu Agent Collection - A community-driven repository of AI agents"
readme = "README.md"
requires-python = ">=3.12.0"
license = { text = "MIT" }
authors = [
    { name = "AI Pilipinas Cebu Community" }
]
keywords = ["ai", "agents", "google-adk", "langchain", "llm", "genai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies - only what's needed for the base project
# Each agent manages its own dependencies in its own pyproject.toml
dependencies = [
    "google-adk>=1.16.0",
    "google-genai>=1.41.0",
    "typing-extensions>=4.15.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.111",
]

# Optional dependencies for specific agents
# Install with: uv sync --extra agent-name
[project.optional-dependencies]
todo-list = []
life-agent = []
chore-organizer = []
automation-analyst = []
contract-analyzer = []
personal-journal = []
all-agents = [
    # Includes all agent-specific dependencies
]

[tool.uv.workspace]
# Define workspace members (each agent is a separate package)
members = [
    "agents/todo-list",
    "agents/life-agent",
    "agents/chore-organizer",
    "agents/automation_analyst",
    "agents/personal-journal",
]

# Exclude certain directories from workspace detection
exclude = [
    "agents/capital-agent",
    "agents/contract-anaylzer",
    "agents/role-automation-workflow",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.5.0",
    "commitizen>=3.13.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version"
]
update_changelog_on_bump = true

[tool.coverage.run]
source = ["agents"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
