# UV Workspace Configuration
# This file configures uv to work with multiple agents as separate packages

[workspace]
# Define workspace members (each agent is a separate package)
members = [
    "agents/todo-list",
    "agents/life-agent",
    "agents/chore-organizer",
    "agents/automation_analyst",
]

# Exclude certain directories from workspace detection
exclude = [
    "agents/capital-agent",
    "agents/contract-anaylzer",
    "agents/role-automation-workflow",
]
